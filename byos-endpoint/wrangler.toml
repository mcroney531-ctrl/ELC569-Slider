name = "byos-panel"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Production. The Worker answers 503 until MODEL is set and the spend limit is confirmed.
[vars]
MODEL = "claude-opus-5-5"      # chosen by the bakeoff (opus-low)
EFFORT = "low"                 # "" to omit; ignored for Haiku
FALLBACKS = "off"              # pinned to the validated model; revisit after staging
MAX_TOKENS = "5500"            # bakeoff max for opus-low was 3,401 output tokens
SPEND_LIMIT_CONFIRMED = "no"   # set "yes" only after the workspace spend limit exists (README step 1)
PER_IP_PER_HOUR = "5"
MAX_CONCURRENT = "3"
DAILY_LIMIT = "100"
TIMEOUT_MS = "80000"

# Optional global daily ceiling. Create a namespace with
#   npx wrangler kv namespace create BYOS_KV
# then uncomment and paste its id (repeat under env.staging if wanted):
# [[kv_namespaces]]
# binding = "BYOS_KV"
# id = "<namespace id>"

# Staging: deploy with `npx wrangler deploy --env staging` to try a candidate model in the real page.
[env.staging]
name = "byos-panel-staging"

[env.staging.vars]
MODEL = "claude-opus-5-5"
EFFORT = "low"
FALLBACKS = "off"
MAX_TOKENS = "5500"
SPEND_LIMIT_CONFIRMED = "no"
PER_IP_PER_HOUR = "10"
MAX_CONCURRENT = "2"
DAILY_LIMIT = "50"
TIMEOUT_MS = "80000"
