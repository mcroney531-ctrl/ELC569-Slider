name = "byos-panel"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# MODEL = "claude-opus-5-5"   # default; set a different model id here if you choose to
PER_IP_PER_HOUR = "5"
MAX_CONCURRENT = "3"
DAILY_LIMIT = "200"
TIMEOUT_MS = "80000"

# Optional global daily ceiling. Create a namespace with
#   npx wrangler kv namespace create BYOS_KV
# then uncomment and paste its id:
# [[kv_namespaces]]
# binding = "BYOS_KV"
# id = "<namespace id>"
